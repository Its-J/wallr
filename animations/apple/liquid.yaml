# Liquid: macOS-inspired organic fluid transition.
name: liquid
duration: 900ms
timeline:
  - at: 0ms
    duration: 900ms
    fade:
      from: 0.0
      to: 1.0
      easing: ease_out
  - at: 0ms
    duration: 600ms
    blur:
      from: 20.0
      to: 0.0
      easing: ease_in_out
  - at: 100ms
    duration: 700ms
    ripple:
      origin: center
      frequency: 12.0
      amplitude: 0.015
      speed: 5.0
      easing: ease_in_out
